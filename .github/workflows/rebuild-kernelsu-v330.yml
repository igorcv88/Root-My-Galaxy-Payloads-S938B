name: Rebuild CZG3 KernelSU v3.3.0 artifacts

on:
  push:
    branches:
      - repair/rebuild-kernelsu-v330-artifacts
    paths:
      - .github/workflows/rebuild-kernelsu-v330.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-czg3-kernelsu-v330
  cancel-in-progress: false

env:
  KSU_REPO: https://github.com/tiann/KernelSU.git
  KSU_TAG: v3.3.0
  KSU_TAG_SHA: 932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e
  TARGET_RELEASE: 6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k
  MODULE_NAME: android15-6.6_kernelsu-s25u-kdp-v3.3.0.ko
  KSUD_NAME: ksud-s25u-kdp-v3.3.0

jobs:
  module:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Build exact CZG3 KernelSU module
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone "$KSU_REPO" /tmp/KernelSU
          cd /tmp/KernelSU
          git checkout --detach "$KSU_TAG_SHA"
          test "$(git rev-parse HEAD)" = "$KSU_TAG_SHA"
          git apply "$GITHUB_WORKSPACE/kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch"

          # Keep the Samsung forward-port as one local source commit so KernelSU's
          # git-based version calculation matches the intended 3.3.0+1 build.
          git config user.name "Root My Galaxy CI"
          git config user.email "root-my-galaxy-ci@users.noreply.github.com"
          git add -A
          GIT_AUTHOR_DATE='2026-08-31T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-08-31T00:00:00Z' \
            git commit -m 'Apply S938B CZG3 Samsung KDP/RKP/DEFEX forward-port'

          test -n "${KDIR:-}"
          test -d "$KDIR"
          mkdir -p "$KDIR/include/config" "$KDIR/include/generated"
          printf '%s\n' "$TARGET_RELEASE" > "$KDIR/include/config/kernel.release"
          printf '#define UTS_RELEASE "%s"\n' "$TARGET_RELEASE" > "$KDIR/include/generated/utsrelease.h"

          cd kernel
          make clean || true
          CONFIG_KSU=m \
          CONFIG_KSU_SAMSUNG_KDP=y \
          CONFIG_KSU_SAMSUNG_RKP=y \
          CONFIG_KSU_SAMSUNG_DEFEX=y \
          CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
          CC=clang make

          mkdir -p "$GITHUB_WORKSPACE/out/module"
          cp kernelsu.ko "$GITHUB_WORKSPACE/out/module/$MODULE_NAME"
          llvm-strip -d "$GITHUB_WORKSPACE/out/module/$MODULE_NAME"
          file "$GITHUB_WORKSPACE/out/module/$MODULE_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/module/$MODULE_NAME"
          stat -c '%n %s bytes' "$GITHUB_WORKSPACE/out/module/$MODULE_NAME"
          strings "$GITHUB_WORKSPACE/out/module/$MODULE_NAME" | grep -F "$TARGET_RELEASE"

      - name: Upload exact module
        uses: actions/upload-artifact@v4
        with:
          name: czg3-kernelsu-module
          path: out/module/${{ env.MODULE_NAME }}
          if-no-files-found: error
          retention-days: 7

  ksud:
    runs-on: ubuntu-latest
    needs: module
    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download exact module
        uses: actions/download-artifact@v4
        with:
          name: czg3-kernelsu-module
          path: out/module

      - name: Checkout and patch KernelSU
        run: |
          set -euxo pipefail
          git clone "$KSU_REPO" /tmp/KernelSU
          cd /tmp/KernelSU
          git checkout --detach "$KSU_TAG_SHA"
          test "$(git rev-parse HEAD)" = "$KSU_TAG_SHA"
          git apply "$GITHUB_WORKSPACE/kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch"
          git config user.name "Root My Galaxy CI"
          git config user.email "root-my-galaxy-ci@users.noreply.github.com"
          git add -A
          GIT_AUTHOR_DATE='2026-08-31T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-08-31T00:00:00Z' \
            git commit -m 'Apply S938B CZG3 Samsung KDP/RKP/DEFEX forward-port'
          mkdir -p userspace/ksud/bin/aarch64
          cp "$GITHUB_WORKSPACE/out/module/$MODULE_NAME" \
             userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android

      - name: Setup Android NDK r29
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build patched ksud with embedded exact module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          cd /tmp/KernelSU
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo clean -p ksud
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
          mkdir -p "$GITHUB_WORKSPACE/out/ksud"
          cp "target/$TRIPLE/release/ksud" "$GITHUB_WORKSPACE/out/ksud/$KSUD_NAME"
          file "$GITHUB_WORKSPACE/out/ksud/$KSUD_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/ksud/$KSUD_NAME"
          stat -c '%n %s bytes' "$GITHUB_WORKSPACE/out/ksud/$KSUD_NAME"

      - name: Upload exact ksud
        uses: actions/upload-artifact@v4
        with:
          name: czg3-ksud
          path: out/ksud/${{ env.KSUD_NAME }}
          if-no-files-found: error
          retention-days: 7

  publish-branch:
    runs-on: ubuntu-latest
    needs: [module, ksud]
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/rebuild-kernelsu-v330-artifacts
          fetch-depth: 0
          lfs: false

      - name: Download module
        uses: actions/download-artifact@v4
        with:
          name: czg3-kernelsu-module
          path: out/module

      - name: Download ksud
        uses: actions/download-artifact@v4
        with:
          name: czg3-ksud
          path: out/ksud

      - name: Publish real Git blobs and synchronize feed metadata
        shell: bash
        run: |
          set -euxo pipefail
          cp "out/module/$MODULE_NAME" "kernelsu/$MODULE_NAME"
          cp "out/ksud/$KSUD_NAME" "kernelsu/$KSUD_NAME"

          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          module = root / 'kernelsu/android15-6.6_kernelsu-s25u-kdp-v3.3.0.ko'
          ksud = root / 'kernelsu/ksud-s25u-kdp-v3.3.0'
          size = ksud.stat().st_size
          sha = hashlib.sha256(ksud.read_bytes()).hexdigest()
          module_size = module.stat().st_size
          module_sha = hashlib.sha256(module.read_bytes()).hexdigest()

          manifest_path = root / 'support/targets-v3.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          target = manifest['payloads'][0]
          target['kernelsu']['url'] = (
              'https://raw.githubusercontent.com/igorcv88/'
              'Root-My-Galaxy-Payloads-S938B/main/kernelsu/ksud-s25u-kdp-v3.3.0'
          )
          target['kernelsu']['size'] = size
          target['kernelsu']['sha256'] = sha
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          workflow_path = root / '.github/workflows/validate-feed.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace('          lfs: true\n', '')
          workflow = re.sub(
              r'assert target\["kernelsu"\]\["sha256"\] == \(\n\s+"[0-9a-f]{64}"\n\s+\)',
              'assert target["kernelsu"]["sha256"] == (\n'
              f'              "{sha}"\n'
              '          )',
              workflow,
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          readme_path = root / 'kernelsu/README.md'
          readme = readme_path.read_text(encoding='utf-8')
          block_pattern = re.compile(
              r'(android15-6\.6_kernelsu-s25u-kdp-v3\.3\.0\.ko\n)'
              r'size: \d+\nSHA-256: [0-9a-f]{64}\n\n'
              r'(ksud-s25u-kdp-v3\.3\.0\n)'
              r'size: \d+\nSHA-256: [0-9a-f]{64}',
          )
          replacement = (
              f'android15-6.6_kernelsu-s25u-kdp-v3.3.0.ko\n'
              f'size: {module_size}\nSHA-256: {module_sha}\n\n'
              f'ksud-s25u-kdp-v3.3.0\n'
              f'size: {size}\nSHA-256: {sha}'
          )
          readme, count = block_pattern.subn(replacement, readme, count=1)
          if count != 1:
              raise SystemExit('failed to update CZG3 artifact metadata block in README')
          readme = readme.replace(
              'Published CZG3 artifacts (stored as Git LFS objects so branch updates and reviews contain textual pointers rather than unsupported inline binary patches):',
              'Published CZG3 artifacts (stored as ordinary Git blobs so commit-pinned raw URLs return executable bytes directly):',
          )
          readme_path.write_text(readme, encoding='utf-8')

          print(f'MODULE_SIZE={module_size}')
          print(f'MODULE_SHA256={module_sha}')
          print(f'KSUD_SIZE={size}')
          print(f'KSUD_SHA256={sha}')
          PY

          # Guard against accidentally committing LFS pointers again.
          test "$(head -c 7 "kernelsu/$KSUD_NAME")" != 'version'
          test "$(head -c 7 "kernelsu/$MODULE_NAME")" != 'version'
          sha256sum "kernelsu/$MODULE_NAME" "kernelsu/$KSUD_NAME"
          git diff --check

          git config user.name "Root My Galaxy CI"
          git config user.email "root-my-galaxy-ci@users.noreply.github.com"
          git add .gitattributes .github/workflows/validate-feed.yml kernelsu/README.md \
                  "kernelsu/$MODULE_NAME" "kernelsu/$KSUD_NAME" support/targets-v3.json
          git status --short
          git commit -m 'Rebuild and publish CZG3 KernelSU v3.3.0 artifacts as Git blobs'
          git push origin HEAD:repair/rebuild-kernelsu-v330-artifacts
