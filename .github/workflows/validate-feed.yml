name: Verificar Payloads

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-payloads
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar arquivos e hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Verificar payloads
        run: python3 .github/scripts/validate_feed.py
