name: Validate payload feed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest and local artifacts
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.parse

          root = pathlib.Path.cwd()
          manifest_path = root / "support" / "targets-v2.json"
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert data.get("schemaVersion") == 2, "unexpected schema version"

          targets = data.get("targets")
          assert isinstance(targets, list) and targets, "empty target feed"
          ids = [target["profileId"] for target in targets]
          assert len(ids) == len(set(ids)), "duplicate profile IDs"

          prefix = (
              "https://raw.githubusercontent.com/BuSung-dev/"
              "Root-My-Galaxy-Payloads/main/"
          )

          def validate_artifact(profile_id: str, artifact: dict) -> None:
              url = artifact["url"]
              expected_size = artifact["size"]
              assert url.startswith(prefix), f"{profile_id}: external artifact URL: {url}"
              relative = urllib.parse.unquote(url.removeprefix(prefix))
              path = root / relative
              assert path.is_file(), f"{profile_id}: missing {relative}"
              actual_size = path.stat().st_size
              assert actual_size == expected_size, (
                  f"{profile_id}: {relative} size {actual_size} != {expected_size}"
              )

          for target in targets:
              validate_artifact(target["profileId"], target["exploit"])
              validate_artifact(target["profileId"], target["kernelsu"])

          validated = next(
              target for target in targets
              if target["profileId"] == "pa3q-S938BXXSBCZG3"
          )
          expected_kernel_release = (
              "6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k"
          )
          expected_kernel_version = (
              "Linux version 6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k "
              "(kleaf@build-host) (Android (11368308, +pgo, +bolt, +lto, +mlgo, "
              "based on r510928) clang version 18.0.0 "
              "(https://android.googlesource.com/toolchain/llvm-project "
              "477610d4d0d988e69dbc3fae4fe86bff3f07f2b5), LLD 18.0.0) "
              "#1 SMP PREEMPT Thu Jul  2 00:48:56 UTC 2026"
          )
          assert validated["model"] == "SM-S938B"
          assert validated["device"] == "pa3q"
          assert validated["buildDisplay"] == "BP4A.251205.006.S938BXXSBCZG3"
          assert validated["kernelRelease"] == expected_kernel_release
          assert validated["kernelVersion"] == expected_kernel_version
          assert validated["sdk"] == 36
          assert validated["abi"] == "arm64-v8a"
          assert validated["pageSize"] == 4096
          assert validated["exploit"]["size"] == 104128

          print(f"Validated {len(targets)} profiles and all referenced payload files")
          PY
