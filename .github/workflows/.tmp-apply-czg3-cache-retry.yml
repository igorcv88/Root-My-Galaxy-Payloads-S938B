name: Apply CZG3 cache retry patch

on:
  push:
    branches:
      - fix/czg3-cache-gate-reclaim-retry

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/czg3-cache-gate-reclaim-retry
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 .github/scripts/.tmp_apply_czg3_cache_retry.py
          git diff --check

      - name: Prepare Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Validate host diagnostics and CZG3 release build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make host-test
          make clean
          make TARGET=pa3q-S938BXXSBCZG3 ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          payload=build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.release.so
          test -s "$payload"
          grep -aFq RMG_BOOT_V1 "$payload"
          grep -aFq pa3q-S938BXXSBCZG3-app-physical-p0-oracle "$payload"

      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git rm .github/workflows/.tmp-apply-czg3-cache-retry.yml
          git rm .github/scripts/.tmp_apply_czg3_cache_retry.py
          git add src/fops.c src/targets/pa3q-S938BXXSBCZG3/target.h
          git commit -m "Fix CZG3 physrw cache-gate reclaim retry"
          git push origin HEAD:fix/czg3-cache-gate-reclaim-retry
