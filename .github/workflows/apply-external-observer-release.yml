name: Apply external observer release mode

on:
  push:
    branches:
      - feat/czg3-external-observer-v2

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'Move CZG3 diagnostics out of the exploit hot path'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/czg3-external-observer-v2
          fetch-depth: 0

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Apply external observer release patch
        run: python3 .github/scripts/apply_external_observer_release.py

      - name: Validate host logic
        run: make host-test

      - name: Build clean CZG3 release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make clean
          make TARGET=pa3q-S938BXXSBCZG3 ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          payload=build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.release.so
          test -s "$payload"
          strings "$payload" | grep -F 'RMG_BOOT_V1'
          strings "$payload" | grep -F 'pa3q-S938BXXSBCZG3-app-physical-p0-oracle'
          for marker in RMG_RACE_V1 RMG_SCHED_V1 RMG_SYS_V1 RMG_PREP_V1 RMG_PREP_CHECKPOINT_V1 RMG_DIAG_V1; do
            if strings "$payload" | grep -Fq "$marker"; then
              echo "Unexpected in-band diagnostic marker in production payload: $marker" >&2
              exit 1
            fi
          done
          git diff --check

      - name: Commit validated source implementation
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git add Makefile src/czg3_diag.h src/czg3_diag.c .github/scripts/validate_feed.py
          git diff --cached --check
          git commit -m "Move CZG3 diagnostics out of the exploit hot path"
          git push origin HEAD:feat/czg3-external-observer-v2
