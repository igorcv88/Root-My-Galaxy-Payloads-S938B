name: Address payload observer review

on:
  push:
    branches:
      - feat/czg3-external-observer-v2

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.head_commit.message != 'Address payload review feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/czg3-external-observer-v2
          fetch-depth: 0

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Apply review fix
        run: python3 .github/scripts/address_observer_review.py

      - name: Validate payload and marker contract
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make host-test
          make clean
          make TARGET=pa3q-S938BXXSBCZG3 ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          payload=build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.release.so
          test -s "$payload"
          grep -aFq 'RMG_BOOT_V1' "$payload"
          grep -aFq 'pa3q-S938BXXSBCZG3-app-physical-p0-oracle' "$payload"
          for marker in RMG_RACE_V1 RMG_SCHED_V1 RMG_SYS_V1 RMG_PREP_V1 RMG_PREP_CHECKPOINT_V1 RMG_DIAG_V1; do
            if grep -aFq "$marker" "$payload"; then
              echo "Unexpected in-band diagnostic marker: $marker" >&2
              exit 1
            fi
          done
          printf 'prefix RMG_DIAG_V1 suffix\n' > "$RUNNER_TEMP/marker-fixture.bin"
          if ! grep -aFq 'RMG_DIAG_V1' "$RUNNER_TEMP/marker-fixture.bin"; then
            echo 'direct binary marker check failed its positive-control fixture' >&2
            exit 1
          fi

      - name: Commit validated review fix
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          rm -f .github/scripts/address_observer_review.py
          rm -f .github/workflows/address-observer-review.yml
          git add -A
          git diff --cached --check
          git commit -m "Address payload review feedback"
          git push origin HEAD:feat/czg3-external-observer-v2
