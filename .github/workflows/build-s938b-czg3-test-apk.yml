name: Build S938B CZG3 test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-s938b-czg3-test-apk.yml

permissions:
  contents: write

concurrency:
  group: s938b-czg3-test-build
  cancel-in-progress: false

env:
  TARGET: pa3q-S938BXXSBCZG3
  PAYLOAD_BRANCH: main
  APP_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out payload main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAYLOAD_BRANCH }}
          fetch-depth: 0
          path: payloads

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36, NDK r29 and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          SDK_LIST="$(mktemp)"
          sdkmanager --list > "$SDK_LIST"
          NDK_PACKAGE="$(awk '/^[[:space:]]*ndk;29\./ { print $1; exit }' "$SDK_LIST")"
          if [ -z "$NDK_PACKAGE" ]; then
            echo "No Android NDK r29 package was reported by sdkmanager." >&2
            grep -E '^[[:space:]]*ndk;' "$SDK_LIST" || true
            exit 1
          fi

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "$NDK_PACKAGE" \
            "cmake;3.22.1"

          NDK_VERSION="${NDK_PACKAGE#ndk;}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "Resolved Android NDK: ${NDK_PACKAGE}"

      - name: Build firmware-specific exploit payload
        working-directory: payloads
        shell: bash
        run: |
          set -euo pipefail
          make TARGET="${TARGET}" ANDROID_NDK_HOME="${ANDROID_NDK_HOME}" release
          test -f "build/${TARGET}/cve-2026-43499-app.release.so"
          test "$(stat -c %s "build/${TARGET}/cve-2026-43499-app.release.so")" -eq 104128
          mkdir -p "artifacts/${TARGET}"
          cp "build/${TARGET}/cve-2026-43499-app.release.so" \
             "artifacts/${TARGET}/cve-2026-43499-app.so"
          sha256sum "artifacts/${TARGET}/cve-2026-43499-app.so"

      - name: Add exact CZG3 profile to main manifest
        working-directory: payloads
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest_path = Path("support/targets-v2.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          profile_id = "pa3q-S938BXXSBCZG3"
          exploit_path = Path(f"artifacts/{profile_id}/cve-2026-43499-app.so")

          target = {
              "profileId": profile_id,
              "manufacturer": "samsung",
              "model": "SM-S938B",
              "device": "pa3q",
              "kernelRelease": "6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k",
              "kernelVersion": "Linux version 6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSBCZG3-4k (kleaf@build-host) (Android (11368308, +pgo, +bolt, +lto, +mlgo, based on r510928) clang version 18.0.0 (https://android.googlesource.com/toolchain/llvm-project 477610d4d0d988e69dbc3fae4fe86bff3f07f2b5), LLD 18.0.0) #1 SMP PREEMPT Thu Jul  2 00:48:56 UTC 2026",
              "kernelBuildVersion": "#1 SMP PREEMPT Thu Jul  2 00:48:56 UTC 2026",
              "buildDisplay": "BP4A.251205.006.S938BXXSBCZG3",
              "buildFingerprint": "samsung/pa3qxxx/pa3q:16/BP4A.251205.006/S938BXXSBCZG3_OXMBCZG3:user/release-keys",
              "sdk": 36,
              "abi": "arm64-v8a",
              "pageSize": 4096,
              "exploit": {
                  "url": f"https://raw.githubusercontent.com/BuSung-dev/Root-My-Galaxy-Payloads/main/artifacts/{profile_id}/cve-2026-43499-app.so",
                  "size": exploit_path.stat().st_size,
              },
              "kernelsu": {
                  "url": "https://raw.githubusercontent.com/BuSung-dev/Root-My-Galaxy-Payloads/main/kernelsu/ksud-s25u-kdp",
                  "size": 6407096,
                  "kmi": "android15-6.6",
                  "managerPackage": "me.weishu.kernelsu",
              },
          }

          targets = [item for item in manifest["targets"] if item["profileId"] != profile_id]
          targets.insert(0, target)
          manifest["targets"] = targets
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

      - name: Publish payload and manifest to main
        working-directory: payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "artifacts/${TARGET}/cve-2026-43499-app.so" \
            support/targets-v2.json
          if git diff --cached --quiet; then
            echo "Main already contains the current payload build."
          else
            git commit -m "Build ${TARGET} test payload"
            git push origin "HEAD:${PAYLOAD_BRANCH}"
          fi
          echo "PAYLOAD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check out app main
        uses: actions/checkout@v4
        with:
          repository: igorcv88/Root-My-Galaxy-S938B
          ref: ${{ env.APP_BRANCH }}
          path: app-src

      - name: Point test APK at the fork main branch
        shell: python
        run: |
          from pathlib import Path

          path = Path("app-src/app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt")
          text = path.read_text(encoding="utf-8")

          old_commit_api = (
              "https://api.github.com/repos/BuSung-dev/"
              "Root-My-Galaxy-Payloads/git/ref/heads/main"
          )
          test_commit_api = (
              "https://api.github.com/repos/igorcv88/"
              "Root-My-Galaxy-Payloads-S938B/git/ref/heads/main"
          )
          old_raw_repo = "https://raw.githubusercontent.com/BuSung-dev/Root-My-Galaxy-Payloads"
          test_raw_repo = "https://raw.githubusercontent.com/igorcv88/Root-My-Galaxy-Payloads-S938B"

          if old_commit_api not in text or old_raw_repo not in text:
              raise SystemExit("PayloadRepository.kt no longer has the expected upstream constants")

          text = text.replace(old_commit_api, test_commit_api)
          text = text.replace(
              f'private const val RAW_REPOSITORY =\n            "{old_raw_repo}"',
              f'private const val RAW_REPOSITORY =\n            "{test_raw_repo}"',
          )
          text = text.replace(
              'private const val MUTABLE_RAW_PREFIX = "$RAW_REPOSITORY/main/"',
              f'private const val MUTABLE_RAW_PREFIX = "{old_raw_repo}/main/"',
          )
          path.write_text(text, encoding="utf-8")

          gradle = Path("app-src/app/build.gradle.kts")
          build_text = gradle.read_text(encoding="utf-8")
          if "compileSdk = 37" not in build_text:
              raise SystemExit("app/build.gradle.kts no longer has compileSdk = 37")
          build_text = build_text.replace("compileSdk = 37", "compileSdk = 36")
          build_text = build_text.replace(
              'versionName = "0.2.3"',
              'versionName = "0.2.3-S938BXXSBCZG3-test"',
          )
          gradle.write_text(build_text, encoding="utf-8")

      - name: Build debug APK
        working-directory: app-src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk \
             "${GITHUB_WORKSPACE}/Root-My-Galaxy-S938BXXSBCZG3-test.apk"

      - name: Write build information
        shell: bash
        run: |
          cat > "${GITHUB_WORKSPACE}/BUILD-INFO.txt" <<EOF
          Device: Samsung SM-S938B
          Firmware: S938BXXSBCZG3
          Profile: ${TARGET}
          Payload branch: ${PAYLOAD_BRANCH}
          Payload commit: ${PAYLOAD_COMMIT}
          APK type: debug-signed test build
          APK compile SDK: 36
          EOF
          sha256sum \
            "${GITHUB_WORKSPACE}/Root-My-Galaxy-S938BXXSBCZG3-test.apk" \
            "${GITHUB_WORKSPACE}/payloads/artifacts/${TARGET}/cve-2026-43499-app.so" \
            >> "${GITHUB_WORKSPACE}/BUILD-INFO.txt"

      - name: Upload test APK and payload
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-S938BXXSBCZG3-test
          if-no-files-found: error
          retention-days: 14
          path: |
            Root-My-Galaxy-S938BXXSBCZG3-test.apk
            BUILD-INFO.txt
            payloads/artifacts/${{ env.TARGET }}/cve-2026-43499-app.so
