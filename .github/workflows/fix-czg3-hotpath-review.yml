name: Fix CZG3 hot-path review

on:
  push:
    branches:
      - feat/czg3-external-observer-v2

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.head_commit.message != 'Address CZG3 hot-path review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/czg3-external-observer-v2
          fetch-depth: 0

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Apply hot-path review fix
        run: python3 .github/scripts/fix_czg3_hotpath_review.py

      - name: Validate exploit and production hot path
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make host-test
          make clean
          make TARGET=pa3q-S938BXXSBCZG3 ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          payload=build/pa3q-S938BXXSBCZG3/cve-2026-43499-app.release.so
          test -s "$payload"
          grep -aFq 'RMG_BOOT_V1' "$payload"
          grep -aFq 'pa3q-S938BXXSBCZG3-app-physical-p0-oracle' "$payload"
          for marker in RMG_RACE_V1 RMG_SCHED_V1 RMG_SYS_V1 RMG_PREP_V1 RMG_PREP_CHECKPOINT_V1 RMG_DIAG_V1; do
            if grep -aFq "$marker" "$payload"; then
              echo "Unexpected in-band diagnostic marker: $marker" >&2
              exit 1
            fi
          done
          if grep -aFq 'slot=%zu,delay_us=%d,nfds=%d,pad=%d,waiter_ready=' "$payload"; then
            echo 'physical race diagnostic state construction remains in production binary' >&2
            exit 1
          fi
          if grep -aFq 'p0=%s,waiter_ready=%d,waiter_waiting=%d' "$payload"; then
            echo 'P0 diagnostic state construction remains in production binary' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/slide_app.c').read_text()
          assert text.count('/* The route cannot prove PI-tree restoration after a failed child. */\n    break;') == 1
          assert text.count('/* A child exit does not prove that a kernel PI waiter was removed. */\n      break;') == 1
          PY
          git diff --check

      - name: Commit validated source fix
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git add src/czg3_diag.h src/slide_app.c
          git diff --cached --check
          git commit -m "Address CZG3 hot-path review"
          git push origin HEAD:feat/czg3-external-observer-v2
