name: Apply scoped CZG3 cache retry

on:
  push:
    branches:
      - fix/czg3-cache-gate-reclaim-retry

permissions:
  contents: write

jobs:
  scope-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/czg3-cache-gate-reclaim-retry
          fetch-depth: 0

      - name: Scope source change
        run: |
          set -euo pipefail
          python3 .github/scripts/.tmp_scope_czg3_cache_retry.py
          git diff --check
          make host-test

      - name: Commit scoped correction
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git rm .github/workflows/.tmp-scope-czg3-cache-retry.yml
          git rm .github/scripts/.tmp_scope_czg3_cache_retry.py
          git add src/fops.c src/targets/pa3q-S938BXXSBCZG3/target.h
          git commit -m "Scope CZG3 cache retry to app payload"
          git push origin HEAD:fix/czg3-cache-gate-reclaim-retry
